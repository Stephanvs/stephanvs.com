<style>
:root{color-scheme:dark;font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;color:#faf5ea}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171917}
#flight{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#scene:active{cursor:grabbing}
#scene:focus-visible{outline:1px solid #fffa;outline-offset:-4px}
.hud::before,.hud::after{content:"";position:absolute;left:0;right:0;z-index:-1;height:100px;pointer-events:none}
.hud::before{top:0;background:linear-gradient(to bottom,#0a10121c,transparent)}
.hud::after{bottom:0;background:linear-gradient(to top,#090e1136,transparent)}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3.2vw,48px);padding-top:max(clamp(20px,3.2vw,48px),env(safe-area-inset-top));padding-bottom:max(clamp(19px,3.2vw,45px),env(safe-area-inset-bottom));transition:opacity .35s;text-shadow:0 1px 8px #161615a8}
#flight.clean .hud{opacity:0;visibility:hidden}
.hud-top,.hud-bottom,.seat,.altitude,.actions{display:flex;align-items:center}
.hud-top,.hud-bottom{justify-content:space-between;gap:16px}
.hud-bottom{align-items:flex-end}
.seat{gap:10px;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.seat svg{width:17px;height:24px;filter:drop-shadow(0 1px 2px #24241c66)}
.seat-number{border-left:1px solid #f1e5ca65;padding-left:12px;margin-left:2px;letter-spacing:.13em;font-weight:500}
.altitude{gap:8px;font:500 10px/1.1 Consolas,"Courier New",monospace;letter-spacing:.10em}
.altitude svg{width:17px;height:17px;opacity:.9}
h1{font-family:"Baskerville","Palatino Linotype","Book Antiqua",Georgia,serif;font-weight:400;font-size:clamp(29px,3.05vw,54px);letter-spacing:-.052em;line-height:1.07;margin:0 0 9px}
.hint{margin:0;color:#f3f0e5dc;font-size:clamp(10px,.85vw,13px);letter-spacing:.025em}
.sep{padding:0 5px;opacity:.6}
.actions{gap:7px;pointer-events:auto}
button{border:1px solid #fff4;color:#fff9ec;background:#1c201e60;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;border-radius:50%;width:39px;height:39px;cursor:pointer;transition:background .18s,border-color .18s}
button:hover,button:focus-visible{background:#383a33c9;border-color:#fff9;outline:none}
button:focus-visible{box-shadow:0 0 0 2px #fff9}
button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
button[hidden],[hidden]{display:none!important}
#message{position:absolute;inset:0;display:grid;place-content:center;padding:30px;text-align:center;font:15px/1.55 "Segoe UI",sans-serif;color:#ede9dc;background:#171917;z-index:2}
@media(max-width:540px){.hud{padding-left:18px;padding-right:18px}.seat{font-size:9px;gap:7px}.altitude{font-size:9px}.actions{gap:5px}button{width:36px;height:36px}.hint{max-width:215px}h1{margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="shader-head" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec2 uLens;
uniform mat3 uCamera;
uniform mat3 uAirframe;
uniform vec3 uEye;
uniform vec3 uWorld;
uniform sampler2D uNoise;
uniform float uTime;
uniform float uQuality;
out vec4 pixel;
vec3 localRay(vec2 uv) {
    return normalize(uCamera * vec3((uv * 2.0 - 1.0) * uLens, -1.0));
}

</script>
<script id="exterior" type="x-shader/x-fragment">

// Distances are kilometres. The cloud, shadow and terrain fields are anchored to Earth.
const vec3 exSun = normalize(vec3(0.40, 0.16, -0.90));
float exDepth = 350.0;

float exCloudAtEye(vec3 ro, float t) {
    float x = mod(ro.x - 11.8 + 21.5, 43.0) - 21.5;
    vec3 q = vec3(x / 2.9, (ro.y - 10.05) / 1.8, (ro.z + 0.55) / 5.5);
    float curl = 0.10 * sin(ro.z * 1.5 + ro.y * 2.1 + x * 1.9)
               + 0.06 * sin(x * 4.7 - ro.y + t * 0.027);
    return 1.0 - smoothstep(0.55, 1.14, length(q) + curl);
}

float exN2(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    return textureLod(uNoise, (i+f+0.5)/256.0, 0.0).r;
}
float exN3(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    vec2 a = i.xz + f.xz + i.y*vec2(37.0,17.0) + 0.5;
    return mix(textureLod(uNoise,a/256.0,0.0).r,
               textureLod(uNoise,(a+vec2(37.0,17.0))/256.0,0.0).r, f.y);
}
float exF2(vec2 p) {
    return exN2(p)*0.54 + exN2(p*2.09+19.3)*0.28
         + exN2(p*4.33-37.1)*0.13 + exN2(p*8.91+5.4)*0.05;
}

vec3 exHorizon(vec3 rd) {
    float facing = clamp(dot(normalize(rd.xz + vec2(0.00001)), normalize(exSun.xz))*0.5+0.5, 0.0, 1.0);
    return mix(vec3(0.30,0.46,0.60),vec3(1.02,0.69,0.48),pow(facing,3.5));
}
vec3 exSky(vec3 ro, vec3 rd, float t) {
    float h = max(rd.y+0.045,0.0), ds = clamp(dot(rd,exSun),0.0,1.0);
    vec3 sky = mix(exHorizon(rd), vec3(0.057,0.230,0.455), 1.0-exp(-h*6.7));
    sky = mix(sky, vec3(0.028,0.107,0.278), smoothstep(0.24,1.05,h)*0.8);
    // Wispy cirrus on an elevated spherical shell. Curvature compresses the layer at the horizon.
    float path = 11.4 / (sqrt(rd.y*rd.y + 0.00179) + max(0.0,rd.y));
    vec2 uv = (ro.xz+rd.xz*path+vec2(t*.009,0.))*0.28;
    vec2 shear = vec2(.78*uv.x+.62*uv.y,-.62*uv.x+.78*uv.y);
    float billow = exF2(shear*.39+vec2(-6.9,7.3));
    vec2 fibers = shear*vec2(.72,3.3)+vec2(.7,3.7)*billow;
    float filament = exF2(fibers+exN2(fibers*.37)*.67);
    float wisps = smoothstep(.53,.76,filament)*smoothstep(.40,.70,billow);
    sky = mix(sky,vec3(.92,.78,.71),wisps*smoothstep(.05,.29,rd.y)*.14);
    float halo = exp((ds-1.0)*30.0), aureole = exp((ds-1.0)*520.0);
    sky += vec3(0.55,0.26,0.095)*halo + vec3(1.05,0.58,0.23)*aureole;
    float disc = smoothstep(0.999976,0.999993,ds);
    return sky + vec3(14.0,10.1,5.9)*disc;
}

vec2 exIslandCoords(vec2 world) {
    return vec2(mod(world.x+62.0,132.0)-66.0, world.y+39.0);
}
float exDrainage(vec2 p, float flank) {
    vec2 a=p-vec2(-2.65,0.48);
    float angle=atan(a.y,a.x);
    float radius=length(a);
    float bends=sin(radius*0.83+angle*2.0)*0.64+sin(angle*5.0)*0.53;
    float branches=abs(sin(angle*9.0+bends+(exN2(p*0.68)-0.5)*0.82));
    return (1.0-smoothstep(0.02,0.56,branches))*smoothstep(0.35,2.4,radius)
           *smoothstep(0.04,0.42,flank);
}
float exRelief(vec2 q) {
    vec2 warp = vec2(exN2(q*0.39+4.2),exN2(q*0.36-31.0))-0.5;
    q += warp*1.05;
    vec2 r = vec2(q.x*0.925-q.y*0.38,q.y*0.925+q.x*0.38);
    float mainMass = 1.0 - length(r/vec2(8.1,3.35));
    float volcanic = 1.18 - length((r-vec2(-2.65,0.48))/vec2(3.4,2.72));
    float shoulder = 1.0-length((r-vec2(4.7,-0.48))/vec2(4.2,2.2));
    float outerIslet = 1.0-length((r-vec2(11.45,-1.4))/vec2(1.95,1.2));
    float second = 1.0-length((q-vec2(13.5,-10.8))/vec2(3.55,2.05));
    float third = 1.0-length((q-vec2(-13.8,6.9))/vec2(2.15,1.3));
    float s = max(max(mainMass, max(volcanic,shoulder)), max(max(outerIslet,second),third));
    float w = clamp(s+0.18,0.0,1.0);
    float ridges = 1.0-abs(2.0*exN2(q*0.85+warp*2.3)-1.0);
    float drainage=exDrainage(r,s);
    return s*(1.49+0.24*ridges) + w*(ridges*0.26 + (exN2(q*2.17)-0.5)*0.19) - drainage*0.35
        + (exN2(q*1.42)-0.5)*0.095;
}

float exCumulusMap(vec2 p) {
    return exN2(p*0.094+19.8)*0.58 + exN2(p*0.203-24.0)*0.30 + exN2(p*0.42+8.0)*0.12;
}
float exTower(vec2 p, vec2 center, vec2 width) {
    vec2 q = (p-center)/width;
    return exp(-dot(q,q));
}
vec3 exCloudDomain(vec3 p) {
    return vec3(mod(p.x+66.0,132.0)-66.0,p.y,p.z);
}
float exPuff(vec3 p, vec3 center, vec3 axes) {
    return (1.0-length((p-center)/axes))*min(axes.x,min(axes.y,axes.z));
}
float exRoundUnion(float a, float b, float width) {
    float h = max(width-abs(a-b),0.0);
    return max(a,b)+h*h/(4.0*width);
}
// Buoyant towers have cauliflower turrets above the condensation level. The
// mature storm spreads into the stable high-altitude air along the wind.
float exStormShape(vec3 p) {
    float form = exPuff(p,vec3(-11.5,6.6,-73.0),vec3(16.0,4.3,10.0));
    form = exRoundUnion(form,exPuff(p,vec3(-11.0,10.2,-72.0),vec3(9.4,4.9,6.3)),1.5);
    form = exRoundUnion(form,exPuff(p,vec3(-10.4,13.8,-72.6),vec3(5.5,3.4,4.6)),0.8);
    form = exRoundUnion(form,exPuff(p,vec3(-15.0,12.5,-69.3),vec3(3.9,3.3,3.4)),0.75);
    form = exRoundUnion(form,exPuff(p,vec3(-5.8,11.1,-73.4),vec3(3.7,3.1,3.8)),0.70);
    form = exRoundUnion(form,exPuff(p,vec3(-19.7,10.3,-70.1),vec3(4.4,3.2,3.3)),0.8);
    form = exRoundUnion(form,exPuff(p,vec3(-9.6,15.3,-75.0),vec3(14.8,1.30,6.3)),0.55);
    return form;
}
float exTradeTower(vec3 p) {
    float f=exPuff(p,vec3(15.8,5.5,-28.7),vec3(7.3,3.2,5.8));
    f=exRoundUnion(f,exPuff(p,vec3(15.5,8.6,-30.1),vec3(4.0,3.4,3.7)),0.68);
    f=exRoundUnion(f,exPuff(p,vec3(14.3,10.6,-30.3),vec3(2.55,2.35,2.65)),0.48);
    f=exRoundUnion(f,exPuff(p,vec3(12.5,7.7,-27.4),vec3(2.5,2.6,2.25)),0.6);
    f=exRoundUnion(f,exPuff(p,vec3(18.9,7.7,-28.3),vec3(3.0,2.7,2.8)),0.6);
    return f;
}
// The negative part of this field is used for empty-space stepping.
float exDensity(vec3 p, float t, float detail) {
    vec3 local=exCloudDomain(p);
    float high=exCloudAtEye(p,t);
    float crossX=mod(p.x-11.8+21.5,43.0)-21.5;
    float crossClearance=max(0.0,length(vec3(crossX/2.9,(p.y-10.05)/1.8,(p.z+0.55)/5.5))-1.24)*1.8;
    float crossStep=-0.20-0.80*crossClearance;
    vec2 drift=p.xz+vec2(t*0.0045,-t*0.0013);
    float cover=exCumulusMap(drift);
    float nearLeft=exTower(local.xz,vec2(-11.8,-26.0),vec2(4.3,5.2));
    float clearLane=exTower(local.xz,vec2(2.5,-34.0),vec2(12.0,8.5));
    cover+=nearLeft*0.38-clearLane*0.29;
    float bottom=1.98+0.56*exN2(drift*0.089-8.3)+0.70*nearLeft;
    float top=bottom+(cover-0.445)*9.5+nearLeft*2.9;
    float shape=min((p.y-bottom)*1.35,(top-p.y)*0.75);
    // Conservative outer bounds avoid evaluating every lobe in clear air.
    vec3 stormB=abs(local-vec3(-12.0,9.7,-72.0))-vec3(19.0,8.4,10.9);
    float stormBound=length(max(stormB,0.0));
    if(stormBound<3.2) shape=max(shape,exStormShape(local));
    else shape=max(shape,-stormBound);
    vec3 nearB=abs(local-vec3(15.6,7.4,-29.0))-vec3(7.8,6.2,6.5);
    float nearBound=length(max(nearB,0.0));
    if(nearBound<2.8) shape=max(shape,exTradeTower(local));
    else shape=max(shape,-nearBound);
    if(shape < -1.65 && high<0.001) return max(shape+0.95,crossStep);
    vec3 wind=vec3(drift.x,p.y*1.08,drift.y);
    float large=exN3(wind*0.59+vec3(6.3,1.8,4.1));
    float middle=exN3(wind*1.52+large*1.20+7.3);
    float fine=exN3(wind*3.51+middle*1.16-17.2);
    float n=(large-0.5)*1.85+(middle-0.5)*0.98+(fine-0.5)*0.49;
    if(detail>0.65) {
        float fray=exN3(wind*8.4+fine*1.45);
        n+=(fray-0.5)*0.33+(exN3(wind*17.3+fray*1.25)-0.5)*0.10;
    }
    float base=shape+n-0.51;
    if(high>0.001) base=max(base,high*2.3-0.75+n*0.64);
    return clamp(base*1.72,crossStep,3.2);
}
float exCloudShadow(vec2 p) {
    vec2 projected = p+exSun.xz*(3.4/exSun.y);
    float c = exCumulusMap(projected);
    vec2 l = exCloudDomain(vec3(projected.x,0.0,projected.y)).xz;
    c += 0.22*exTower(l,vec2(-11.8,-26.0),vec2(5.,6.)) + 0.28*exTower(l,vec2(-11.,-72.),vec2(17.,16.));
    return mix(1.0,0.58,smoothstep(0.51,0.74,c));
}

vec3 exOcean(vec2 p, vec3 rd, float d, float shore, float t) {
    
    vec2 flow = p + vec2(t*0.007,-t*0.002);
    float swells = exF2(flow*vec2(0.36,1.17));
    float wind = exN2(flow*vec2(1.8,6.1)+swells*2.8);
    float ripple = exN2(flow*vec2(6.1,18.0)+wind*2.5);
    float footprint=d*0.80/max(uResolution.y,430.0);
    float waveFilter=1.0/(1.0+footprint*footprint*35.0);
    ripple=mix(0.51,ripple,waveFilter);
    vec3 blue = mix(vec3(0.010,0.044,0.094),vec3(0.021,0.104,0.171),swells*0.76+wind*0.24);
    float flash=pow(1.0-clamp(-rd.y,0.0,1.0),4.5);
    blue = mix(blue,vec3(0.13,0.24,0.31),flash*0.44);
    blue*=0.87+0.22*wind+0.065*ripple;
    if(shore>-1.35) {
        float coral=exF2(p*1.38+swells);
        float reefPatch=exF2(p*0.63+exN2(p*0.27)*2.6);
        float submerged=max(0.0,-shore);
        float shelf=exp(-submerged*mix(1.20,5.5,reefPatch));
        float lagoon=smoothstep(0.36,0.70,reefPatch+0.16*(coral-0.5));
        vec3 cyan=mix(vec3(0.031,0.19,0.193),vec3(0.120,0.47,0.411),lagoon);
        cyan*=0.81+0.39*coral;
        blue=mix(blue,cyan,shelf*(0.67+0.22*lagoon));
        vec2 coast=exIslandCoords(p);
        float upwind=exRelief(coast+vec2(0.18,-0.32));
        float breaking=smoothstep(-0.075,0.095,shore-upwind);
        float beach=1.0-smoothstep(0.0,0.042,abs(shore+0.018+(coral-0.5)*0.047));
        blue=mix(blue,vec3(0.58,0.61,0.48),beach*(0.14+0.66*breaking)*mix(0.48,1.0,coral));
        float reefline=1.0-smoothstep(0.014,0.070,abs(shore+0.10+reefPatch*0.52+(coral-0.5)*0.44));
        blue+=vec3(0.22,0.33,0.29)*reefline*breaking*smoothstep(0.31,0.72,coral)*0.83;
    }
    vec3 h = normalize(exSun-rd+vec3(0.0,0.00001,0.0));
    vec2 slope = h.xz/max(h.y,0.02);
    float rough = 0.035 + 0.012*swells;
    float lobe = exp(-dot(slope,slope)/rough);
    float glints = 0.22 + 2.80*pow(clamp(0.30*swells+0.32*wind+0.38*ripple,0.0,1.0),3.0);
    glints += 1.4*smoothstep(0.65,0.86,ripple)*wind;
    float sun = exCloudShadow(p);
    vec3 c = blue*(0.56+0.44*sun);
    c += vec3(2.15,1.39,0.70)*lobe*glints*sun;
    float haze=1.0-exp(-pow(d*0.0085,1.46));
    return mix(c,mix(vec3(0.27,0.41,0.51),exHorizon(rd)+vec3(0.55,0.26,0.095)*exp((max(dot(rd,exSun),0.0)-1.0)*30.0),smoothstep(39.0,210.0,d)),haze);
}

vec3 exSurface(vec3 ro, vec3 rd, float distanceToSea, float t, out float hit) {
    vec2 sea = ro.xz + rd.xz*distanceToSea, q = exIslandCoords(sea);
    hit=distanceToSea;
    float shore = -5.0;
    float relief=0.0;
    if(abs(q.y)<25.0 && abs(q.x)<30.0) shore=exRelief(q);
    if (distanceToSea < 150.0 && rd.y < -0.064) {
        float hi = max(0.0,distanceToSea - 2.6/max(-rd.y,0.064));
        vec2 nearq = exIslandCoords(ro.xz+rd.xz*hi);
        if (abs(0.5*(q.y+nearq.y)) < 18.0+0.5*abs(q.y-nearq.y) &&
            min(abs(q.x),abs(nearq.x))<29.0) {
            float lastD=hi;
            for(int i=1;i<=28;i++) {
                float at = mix(hi,distanceToSea,float(i)/28.0);
                vec3 here=ro+rd*at;
                float altitude=here.y + dot(rd.xz,rd.xz)*at*at/12742.0;
                float ht=exRelief(exIslandCoords(here.xz));
                if(ht>altitude) {
                    float a=lastD,b=at;
                    for(int j=0;j<4;j++) {
                        float m=(a+b)*0.5;
                        vec3 mid=ro+rd*m;
                        if(exRelief(exIslandCoords(mid.xz))>mid.y+dot(rd.xz,rd.xz)*m*m/12742.0) b=m; else a=m;
                    }
                    hit=(a+b)*0.5;
                    relief=exRelief(exIslandCoords(ro.xz+rd.xz*hit));
                    break;
                }
                lastD=at;
            }
        }
    }
    if(relief<=0.0) return exOcean(sea,rd,distanceToSea,shore,t);
    vec2 p=ro.xz+rd.xz*hit, xy=exIslandCoords(p);
    float e=0.078+hit*0.0010;
    vec3 n=normalize(vec3(exRelief(xy-vec2(e,0))-exRelief(xy+vec2(e,0)),2.0*e,
                          exRelief(xy-vec2(0,e))-exRelief(xy+vec2(0,e))));
    float forest=exF2(xy*3.4);
    vec3 albedo=mix(vec3(0.024,0.059,0.041),vec3(0.095,0.172,0.085),forest);
    albedo=mix(albedo,vec3(0.22,0.206,0.157),(1.0-smoothstep(0.27,0.60,n.y))*0.73);
    albedo=mix(vec3(0.45,0.42,0.29),albedo,smoothstep(0.00,0.052+0.035*forest,relief));
    float ndl=max(0.0,dot(n,exSun));
    vec3 c=albedo*(vec3(0.41,0.55,0.63)+vec3(2.20,1.60,0.96)*ndl*exCloudShadow(p));
    return mix(c,mix(vec3(0.23,0.33,0.36),exHorizon(rd)*0.70,0.17),1.0-exp(-hit*0.0040));
}

vec3 renderExterior(vec3 ro, vec3 rd, float t) {
    float k = dot(rd.xz,rd.xz)/12742.0;
    float discr=rd.y*rd.y-4.0*k*ro.y;
    float ground = (rd.y<0.0 && discr>=0.0) ? 2.0*ro.y/(-rd.y+sqrt(max(discr,0.0))) : 351.0;
    float bgDepth=350.0;
    vec3 bg;
    if(ground<350.0) bg=exSurface(ro,rd,ground,t,bgDepth);
    else bg=exSky(ro,rd,t);
    // Beneath the anvil, falling rain extinguishes the distant sea. The sloping
    // shaft sits in world space, so nearer islands and clouds pass in front of it.
    float stormX=132.0*floor((ro.x+11.5)/132.0+.5)-11.5;
    vec2 storm=vec2(stormX,-72.0);
    float rainT=dot(storm-ro.xz,rd.xz)/max(.001,dot(rd.xz,rd.xz));
    if(rainT>0.0 && rainT<bgDepth){
        vec3 rp=ro+rd*rainT;
        vec2 delta=(rp.xz-storm-vec2(3.5,.5)*(1.-clamp(rp.y/6.,0.,1.)))/vec2(11.,6.5);
        float shaft=exp(-dot(delta,delta)*1.85)*(1.-smoothstep(3.5,8.0,rp.y))*smoothstep(-1.,1.0,rp.y);
        float strands=exF2(vec2(rp.x*.54+rp.y*.083,rp.z*.24+rp.y*.042));
        float rain=shaft*(.52+.30*strands);
        bg=mix(bg,vec3(.155,.207,.274),rain);
        bgDepth=mix(bgDepth,rainT,rain);
    }
    float farT = min(bgDepth,128.0);
    if(rd.y>0.010) farT=min(farT,(17.25-ro.y)/rd.y);
    if(rd.y < -0.010) farT=min(farT,(1.17-ro.y)/rd.y);
    float phase=clamp(dot(rd,exSun),-1.0,1.0);
    float facing=pow(0.5+0.5*phase,6.0);
    float marchBias=fract(dot(gl_FragCoord.xy,vec2(0.75487766,0.56984029)));
    float optical=1.0, weighted=0.0;
    vec3 light=vec3(0.0);
    float dist=0.025+0.11*marchBias;
    float quality=clamp(uQuality,0.0,1.0);
    for(int i=0;i<174;i++) {
        if(optical<0.009 || dist>=farT) break;
        vec3 p=ro+rd*dist;
        float density=exDensity(p,t,step(0.45,quality)*step(dist,80.0));
        float stepSize=mix(0.35,0.17,quality)+dist*mix(0.0090,0.0041,quality);
        if(density>0.001) {
            float sun1=max(0.0,exDensity(p+exSun*0.75,t,0.0));
            float sun2=max(0.0,exDensity(p+exSun*2.65,t,0.0));
            float sun3=max(0.0,exDensity(p+exSun*6.7,t,0.0));
            float transmit=exp(-1.02*sun1-0.85*sun2-0.60*sun3);
            float facingLight=1.0;
            if(quality>0.68 && dist<82.0) {
                float fineShadow=exDensity(p+exSun*0.28,t,1.0);
                facingLight=clamp(1.0+(density-fineShadow)*0.37,0.65,1.25);
            }
            float rise=smoothstep(2.3,13.4,p.y);
            float ceiling=clamp(density*0.18+sun2*0.16+sun3*0.08,0.0,1.0);
            vec3 ambient=mix(vec3(0.093,0.139,0.205),vec3(0.222,0.307,0.405),rise);
            ambient*=mix(1.05,0.57,ceiling);
            float powder=0.72+0.28*(1.0-exp(-density*3.1));
            vec3 glow=vec3(1.16,0.850,0.551)*transmit*facingLight*(0.87+0.34*facing)*powder;
            glow+=vec3(0.46,0.26,0.095)*exp((phase-1.0)*17.0)*exp(-density*1.2);
            vec3 local=ambient+glow;
            float core=exTower(exCloudDomain(p).xz,vec2(-11.5,-72.),vec2(14.,9.))*(1.-smoothstep(5.,12.,p.y));
            local*=mix(vec3(1.),vec3(.57,.65,.76),core);
            local=mix(local,mix(vec3(0.32,0.425,0.54),exHorizon(rd)*0.77,
                     smoothstep(48.0,165.0,dist)),1.0-exp(-dist*0.0041));
            float ds=min(stepSize,farT-dist);
            float alpha=1.0-exp(-density*1.72*ds*(1.0-smoothstep(95.0,128.0,dist)));
            float contribution=optical*alpha;
            light+=local*contribution;
            weighted+=dist*contribution;
            optical-=contribution;
        } else {
            stepSize+=min(4.0,max(-density,0.0)*0.58);
        }
        dist+=stepSize*(0.985+0.03*marchBias);
    }
    exDepth = weighted + optical*bgDepth;
    return light + optical*bg;
}

<script id="world-main" type="x-shader/x-fragment">

uniform sampler2D uLastOutside;
uniform mat3 uPriorView;
uniform vec3 uDisplacement;
uniform vec2 uPriorLens,uJitter;
uniform bool uHistoryValid;
void main(){
    vec3 ray=localRay((gl_FragCoord.xy+uJitter)/uResolution);
    // Skip opaque fuselage. Extra margin covers reconstruction and shutter samples at the seal.
    float pane=ray.z<0.0?-.226:3.666;
    vec3 point=uEye+ray*((pane-uEye.z)/(abs(ray.z)>.0001?ray.z:.0001));
    vec2 q=point.xy-vec2(.846*floor(point.x/.846+.5),.025);
    vec2 margin=vec2(.026)+9.0*abs((pane-uEye.z)/max(abs(ray.z),.001))*uLens/uResolution;
    vec2 a=abs(q)/(vec2(.179,.238)+margin);
    if(dot(a*a,a)>1.0||abs(point.x)>12.0){pixel=vec4(0);return;}
    vec3 rd=uAirframe*ray;
    vec3 col=max(renderExterior(uWorld,rd,uTime),0.0);
    // A reversible transfer curve preserves sky highlights in the compact HDR buffer.
    float packedDepth=log2(1.0+clamp(exDepth,0.0,400.0))/log2(401.0);
    vec3 encoded=sqrt(col/(1.0+col));
    if(uHistoryValid){
        vec3 prev=uPriorView*(rd*max(exDepth,.025)+uDisplacement);
        vec2 uv=.5+.5*prev.xy/(uPriorLens*max(.001,-prev.z));
        if(prev.z<0.&&all(greaterThan(uv,vec2(0)))&&all(lessThan(uv,vec2(1)))){
            vec4 history=textureLod(uLastOutside,uv,0.);
            float trust=(1.-smoothstep(.006,.047,abs(history.a-packedDepth)))*step(.003,history.a);
            vec3 delta=clamp(history.rgb-encoded,vec3(-.048),vec3(.048));
            encoded+=delta*.59*trust;
        }
    }
    pixel=vec4(encoded,packedDepth);
}

<script id="cabin" type="x-shader/x-fragment">
// The cabin is in metres. Its longitudinal axis is +X.
const float caPitch = 0.846;
const float caWidth = 3.44;
const float caEnd = 11.40;
float caHitRange;
float caRepeat(float x, float stride) {
    return x - stride * floor(x / stride + 0.5);
}
float caWindowShape(vec2 p, vec2 b) {
    vec2 a = abs(p / b);
    return dot(a * a, a) - 1.0;
}
float caBox(vec3 p, vec3 halfSize, float bevel) {
    vec3 q = abs(p) - halfSize + bevel;
    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - bevel;
}
float caRect(vec2 p, vec2 halfSize, float radius) {
    vec2 q = abs(p) - halfSize + radius;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - radius;
}
float caEdge(float d, float w) {
    return 1.0 - smoothstep(0.0, w, abs(d));
}
float caGrain(vec2 p) {
    return textureLod(uNoise, p * 2.2,0.0).r - 0.5;
}
vec3 caSeatCell(vec3 p) {
    p.x = caRepeat(p.x + 0.084, caPitch) - 0.084;
    p.z = min(p.z, caWidth - p.z) - 0.228;
    p.z -= 0.479 * clamp(floor(p.z / 0.479 + 0.5), 0.0, 2.0);
    return p;
}
vec2 caChoice(vec2 a, float d, float id) {
    return d < a.x ? vec2(d, id) : a;
}
float caCushion(float x,vec2 zy,vec3 halfSize,float corner,float edge) {
    vec2 d=vec2(abs(x)-halfSize.x,caRect(zy,halfSize.zy,corner))+edge;
    return length(max(d,0.0))+min(max(d.x,d.y),0.0)-edge;
}
vec2 caSeatMap(vec3 world) {
    vec3 p = caSeatCell(world);
    float back = caRepeat(p.x + 0.303 + 0.153 * (p.y + 0.48), caPitch);
    float wrap=0.029*smoothstep(0.065,0.225,abs(p.z));
    vec2 hit = vec2(caCushion(back-wrap,p.zy+vec2(0.0,0.253),vec3(0.038,0.304,0.219),0.073,0.013), 1.0);
    hit=caChoice(hit,caCushion(back-wrap-0.039,p.zy+vec2(0.0,0.259),vec3(0.047,0.301,0.209),0.068,0.030),6.0);
    float ear=0.029*smoothstep(0.085,0.164,abs(p.z));
    hit=caChoice(hit,caCushion(back-0.016-ear,p.zy-vec2(0.0,0.055),vec3(0.067,0.104,0.171),0.066,0.034),2.0);
    float trayCurve=0.005*dot(p.zy-vec2(0.0,-0.192),p.zy-vec2(0.0,-0.192))*22.0;
    hit=caChoice(hit,caCushion(back+0.040-trayCurve,p.zy+vec2(0.0,0.205),vec3(0.0075,0.101,0.162),0.018,0.004),7.0);
    hit=caChoice(hit,caCushion(back+0.038,p.zy+vec2(0.0,0.096),vec3(0.014,0.012,0.030),0.006,0.005),8.0);
    hit=caChoice(hit,caCushion(back+0.032,p.zy+vec2(0.0,0.402),vec3(0.022,0.061,0.152),0.019,0.008),9.0);
    hit = caChoice(hit, caBox(vec3(caRepeat(p.x + 0.031,caPitch),p.y + 0.543,p.z), vec3(0.259, 0.077, 0.215), 0.063), 3.0);
    vec3 arm = vec3(caRepeat(p.x + 0.064,caPitch), p.y + 0.337, abs(p.z) - 0.233);
    hit = caChoice(hit, caBox(arm, vec3(0.174, 0.028, 0.025), 0.019), 4.0);
    hit = caChoice(hit, caBox(arm + vec3(0.105, 0.083, 0.0), vec3(0.030, 0.085, 0.017), 0.014), 5.0);
    if (p.y < -0.588) {
        vec3 post = vec3(abs(caRepeat(p.x + 0.047,caPitch)) - 0.133 - 0.13 * (p.y + 0.65), p.y + 0.805, abs(p.z) - 0.145);
        hit = caChoice(hit, caBox(post, vec3(0.019, 0.220, 0.015), 0.009), 5.0);
        hit = caChoice(hit, caBox(vec3(p.x + 0.033, p.y + 0.641, p.z), vec3(0.222, 0.028, 0.201), 0.016), 5.0);
    }
    return hit;
}
vec3 caSeatNormal(vec3 p, float eps) {
    vec2 k = vec2(1.0, -1.0) * eps;
    return normalize(k.xyy * caSeatMap(p + k.xyy).x + k.yyx * caSeatMap(p + k.yyx).x
        + k.yxy * caSeatMap(p + k.yxy).x + k.xxx * caSeatMap(p + k.xxx).x);
}
float caSunPatch(vec3 p) {
    float dist = min(p.z + 0.115, caWidth + 0.115 - p.z);
    vec2 lightUV = vec2(caRepeat(p.x + 0.43 * dist, caPitch), p.y + 0.19 * dist - 0.025);
    float edge = caRect(lightUV, vec2(0.174, 0.230), 0.132);
    return (1.0 - smoothstep(-0.014, 0.023 + 0.020 * dist, edge)) * exp(-0.85 * dist);
}
vec3 caLit(vec3 base, vec3 p, vec3 n, vec3 rd, float daylight, float shine) {
    bool nearWall = p.z < 0.5 * caWidth;
    float dist = max(0.0, min(p.z + 0.11, caWidth + 0.11 - p.z));
    float side = nearWall ? -1.0 : 1.0;
    vec3 sky = normalize(vec3(0.10, 0.29, side));
    vec3 sun = normalize(vec3(0.40, 0.16, -0.90));
    float visible = nearWall ? caSunPatch(p) : 0.0;
    vec3 diffuse = vec3(0.123, 0.113, 0.112) + vec3(0.105, 0.098, 0.094) * (n.y * 0.5 + 0.5);
    diffuse += vec3(0.52, 0.61, 0.67) * (0.26 + 0.74 * max(dot(n, sky), 0.0)) * exp(-0.80 * dist) * daylight;
    diffuse += vec3(1.45, 0.93, 0.54) * max(dot(n, sun), 0.0) * visible * daylight;
    vec3 h = normalize(sky - rd);
    vec3 spec = vec3(0.43, 0.53, 0.61) * pow(max(dot(n, h), 0.0), 34.0) * daylight * exp(-0.65 * dist);
    return base * diffuse + shine * spec;
}
vec2 caBeltUV(vec2 p,vec2 anchor,vec2 tip) {
    vec2 axis=tip-anchor;
    float size=length(axis);
    axis/=size;
    vec2 offset=p-anchor;
    return vec2(dot(offset,axis)/size,dot(offset,vec2(-axis.y,axis.x)));
}
vec3 caBelt(vec3 base,vec2 uv, bool buckle) {
    float bend=sin(clamp(uv.x,0.0,1.0)*3.14159)*0.012;
    float width=abs(uv.y-bend);
    float ribbon=(1.0-smoothstep(0.016,0.019,width))*smoothstep(-.015,.008,uv.x)*(1.0-smoothstep(.994,1.015,uv.x));
    vec3 webbing=vec3(.033,.038,.038)*(0.91+0.11*sin(uv.y*2400.0)+0.05*sin(uv.x*324.0));
    base=mix(base,webbing,ribbon);
    vec2 metalUV=vec2((uv.x-0.99)*0.25,uv.y);
    vec2 metalSize=buckle?vec2(0.024,0.023):vec2(0.022,0.016);
    float rim=caRect(metalUV,metalSize,0.004);
    float face=1.0-smoothstep(-0.0004,0.0018,rim);
    if(!buckle)face*=smoothstep(0.003,0.0053,length(metalUV-vec2(0.007,0.0)));
    vec3 steel=vec3(.37,.41,.41)*(.60+.45*smoothstep(-.02,.012,metalUV.y));
    steel+=vec3(.16)*caEdge(rim+0.0017,0.0013);
    if(buckle)steel*=1.0-.46*caEdge(caRect(metalUV-vec2(.002,0.0),vec2(.014,.015),.0025),.002);
    return mix(base,steel,face);
}
vec3 caShadeSeat(vec3 p, vec3 n, vec3 rd, float id, float daylight) {
    vec3 q = caSeatCell(p);
    vec2 uv = vec2(q.z + 0.35 * q.x, q.y);
    float grain = caGrain(uv);
    vec3 cloth = mix(vec3(0.049, 0.079, 0.097), vec3(0.073, 0.108, 0.124), 0.5 + 0.49 * sin(3.0 + floor((p.x + 0.51) / caPitch) * 17.3));
    vec3 base = cloth;
    float shine = 0.043;
    if (id==1.0 || id==7.0 || id==8.0) {
        base=id==1.0 ? vec3(0.227,0.249,0.251) : (id==7.0 ? vec3(0.264,0.278,0.276) : vec3(0.105,0.120,0.121));
        float tray=caRect(q.zy+vec2(0.0,0.205),vec2(0.162,0.101),0.018);
        if(id==1.0) {
            base*=1.0-0.45*exp(-abs(tray)*114.0);
            base*=1.0-0.17*exp(-abs(q.y+0.067)*45.0)*(1.0-smoothstep(.11,.184,abs(q.z)));
            base*=1.0-0.29*caEdge(caRect(q.zy+vec2(0.0,0.402),vec2(0.152,0.061),0.019),0.010);
        }
        float lip=caRect(q.zy+vec2(0.0,0.205),vec2(0.153,0.093),0.015);
        if(id==7.0)base*=1.0-0.074*caEdge(lip,0.0028);
        base*=1.0+0.041*grain;
        shine=id==8.0 ? 0.11 : 0.068;
    } else if (id==2.0 || id==3.0 || id==6.0 || id==9.0) {
        vec2 fabric = id > 2.5 ? q.xz : uv;
        float threads = sin(2120.0 * fabric.x) * sin(1590.0 * fabric.y);
        float alias = clamp(1.0 - distance(p, vec3(0.0)) * 0.78, 0.0, 1.0);
        base *= 1.0 + 0.065 * alias * threads + 0.11 * grain;
        float welt = abs(q.z) - (id==2.0 ? 0.140 : 0.181);
        base *= 1.0 - 0.40 * caEdge(welt, 0.0028);
        base += vec3(0.014, 0.019, 0.018) * caEdge(welt + 0.003, 0.0017);
        if (id==2.0) {
            base=mix(base,vec3(.039,.059,.066),.34);
            base*=1.0-0.33*caEdge(q.y-0.071,0.0014);
            base+=vec3(.012,.014,.011)*caEdge(q.y-0.074,0.0011);
        }
        if(id==6.0) {
            float seam=abs(q.z)-(.134+.014*smoothstep(-.47,-.07,q.y));
            base*=1.0-.28*caEdge(seam,.0025);
            base+=vec3(.012,.014,.013)*caEdge(seam+.0026,.0011);
            float pad=smoothstep(.017,.135,abs(q.z))*(1.0-smoothstep(.132,.177,abs(q.z)));
            base*=1.0+.11*pad-.10*exp(-abs(q.y+.072)*13.0);
        }
        if(id==3.0 && n.y>0.53) {
            float key=fract(sin(floor((p.x+.42)/caPitch)*37.73+floor(p.z/.479)*15.61)*4325.381);
            base=caBelt(base,caBeltUV(q.xz,vec2(-.164,-.205),vec2(-.026+.072*key,-.019)),true);
            base=caBelt(base,caBeltUV(q.xz,vec2(-.159,.204),vec2(.038+.052*key,.040+.029*key)),false);
        }
        if(id==9.0)base*=0.69+0.16*sin(q.z*300.0)*sin(q.y*270.0)+0.19*caEdge(q.y+0.347,0.004);
    } else {
        base = id < 4.5 ? vec3(0.073, 0.081, 0.080) : vec3(0.190, 0.210, 0.223);
        shine = id < 4.5 ? 0.078 : 0.23;
    }
    float underSeat = smoothstep(-0.99, -0.29, p.y);
    float ao=0.38+0.36*clamp(caSeatMap(p+n*0.045).x/0.045,0.0,1.0)
                  +0.26*clamp(caSeatMap(p+n*0.145).x/0.145,0.0,1.0);
    float edgeLight=0.66+0.34*smoothstep(-0.46,0.09,q.y+0.42*q.z);
    vec3 wing=caLit(base, p, n, rd, daylight, shine)*edgeLight;
    float sheen=pow(1.0-abs(dot(n,rd)),3.0)*max(0.0,n.y+0.25);
    return (wing+cloth*daylight*sheen*0.65)*ao*mix(0.43,1.0,underSeat);
}
// A wall cross-section is a collection of extruded, closed panels.
void caPanel(vec3 ro, vec3 rd, vec2 a, vec2 b, float kind, inout vec4 hit) {
    vec2 edge = b - a;
    vec2 normal = vec2(-edge.y, edge.x);
    float denom = dot(rd.zy, normal);
    if (abs(denom) < 0.00002) return;
    float d = dot(a - ro.zy, normal) / denom;
    if (d < 0.001 || d >= hit.x) return;
    float along = dot(ro.zy + d * rd.zy - a, edge) / dot(edge, edge);
    if (along < 0.0 || along > 1.0) return;
    normal = normalize(normal) * (denom < 0.0 ? 1.0 : -1.0);
    hit = vec4(d, kind, normal.y, normal.x);
}
void caHalfShell(vec3 ro, vec3 rd, float mirrored, inout vec4 h) {
    // The profile runs from the dado to the aisle ceiling.
    vec3 o = ro, r = rd;
    if (mirrored > 0.5) { o.z = caWidth - o.z; r.z = -r.z; }
    vec4 h2 = vec4(h.x, -1.0, 0.0, 0.0);
    caPanel(o,r,vec2(0.113,-1.030),vec2(-0.087,-0.632), 11.0,h2);
    caPanel(o,r,vec2(-0.087,-0.632),vec2(-0.107,-0.345), 11.0,h2);
    caPanel(o,r,vec2(-0.107,-0.345),vec2(-0.107,0.393), 12.0,h2);
    caPanel(o,r,vec2(-0.107,0.393),vec2(-0.053,0.530), 13.0,h2);
    caPanel(o,r,vec2(-0.053,0.530),vec2(0.052,0.566), 14.0,h2);
    caPanel(o,r,vec2(0.052,0.566),vec2(0.70,0.530), 15.0,h2);
    caPanel(o,r,vec2(0.70,0.530),vec2(0.811,0.575), 16.0,h2);
    caPanel(o,r,vec2(0.811,0.575),vec2(0.923,0.686), 16.0,h2);
    caPanel(o,r,vec2(0.923,0.686),vec2(1.041,0.854), 16.0,h2);
    caPanel(o,r,vec2(1.041,0.854),vec2(1.145,0.932), 17.0,h2);
    caPanel(o,r,vec2(1.145,0.932),vec2(caWidth*0.5,0.968), 17.0,h2);
    if (h2.y >= 0.0) {
        h = h2;
        if (mirrored > 0.5) h.w *= -1.0;
    }
}
vec3 caShadePanel(vec3 p, vec3 n, vec3 rd, float kind, float daylight) {
    float z = min(p.z, caWidth - p.z);
    float rowX = caRepeat(p.x, caPitch);
    float seam = caEdge(abs(rowX) - caPitch * 0.5, 0.0045);
    float grain = caGrain(vec2(p.x, p.y + 0.6 * z));
    vec3 base = vec3(0.415, 0.396, 0.353) * (1.0 + 0.034 * grain);
    vec3 emission = vec3(0.0);
    if (kind < 10.5) {
        float carpet = 0.5 + 0.5 * sin(570.0*p.z)*sin(430.0*p.x+1.4*sin(p.z*31.0));
        base = mix(vec3(0.033,0.047,0.054), vec3(0.045,0.061,0.065), carpet*.59+.35*(grain+.5));
        base *= mix(0.39,1.0,smoothstep(1.12,1.57,z));
        float aisleEdge = caEdge(z - 1.486, 0.0055);
        base += vec3(0.11,0.12,0.105) * aisleEdge;
        emission = vec3(0.096,0.116,0.096) * aisleEdge * (1.0 - smoothstep(0.010, 0.022, abs(rowX + 0.2)));
    } else if (kind < 13.5) {
        base *= 1.0 - 0.28 * seam;
        base *= 1.0 - 0.28 * caEdge(p.y + 0.606, 0.004);
        // A shallow shadow follows the join in the outer sidewall liner.
        vec2 windowUV = vec2(rowX, p.y-0.025);
        float ring = caWindowShape(windowUV, vec2(0.224,0.283));
        base *= 1.0 - 0.22 * exp(-abs(ring) * 13.0);
        base += vec3(0.039,0.035,0.027) * exp(-abs(ring-0.074) * 25.0);
        if(kind==11.0 || kind==13.0) {
            float soft=.17+.83*smoothstep(-.31,.27,p.y-.025+.45*rowX);
            vec3 liner=vec3(.208,.208,.193)*(.18+daylight*(.12+.15*soft));
            liner*=.73+.27*smoothstep(-1.01,-.39,p.y);
            liner*=1.0-.20*seam-.18*caEdge(p.y+.606,.0035);
            return liner*(1.0+.058*grain);
        }
    } else if (kind < 14.5) {
        base *= 0.61;
        float lamp = exp(-abs(z-0.014)*115.0);
        emission = vec3(0.98,0.76,0.43) * (0.04+0.53*lamp);
    } else if (kind < 15.5) {
        base*=0.84+0.16*smoothstep(0.05,0.66,z);
        base *= 0.84 - 0.19 * seam;
        float strip = caRect(vec2(rowX, z-0.421),vec2(0.184,0.091),0.029);
        base *= 1.0 - 0.24*caEdge(strip,0.0028);
        vec2 lens = vec2(caRepeat(rowX,0.091),z-0.427);
        if (abs(rowX)<0.151) {
            float roundLens = length(lens);
            base *= 1.0 - 0.50*(1.0-smoothstep(0.019,0.024,roundLens));
            emission += vec3(0.78,0.67,0.48)*0.28*(1.0-smoothstep(0.012,0.018,roundLens));
            float nozzle = length(vec2(lens.x,z-0.469));
            base *= 1.0 - 0.68 * (1.0-smoothstep(0.010,0.018,nozzle));
        }
    } else if (kind < 16.5) {
        float doorX = caRepeat(p.x+0.18,1.5*caPitch);
        float curve=smoothstep(0.694,1.064,z);
        n=normalize(vec3(0.0,-cos(curve*1.40),sin(curve*1.40)*(p.z<0.5*caWidth?1.0:-1.0)));
        base*=0.68+0.30*curve;
        base *= 1.02 - 0.55 * caEdge(abs(doorX)-0.75*caPitch,0.0045);
        float latch = caRect(vec2(doorX,p.y-0.635),vec2(0.069,0.012),0.009);
        base *= 1.0 - 0.57*(1.0-smoothstep(-0.002,0.003,latch));
        base += vec3(0.061) * caEdge(latch - 0.003, 0.003);
    } else if (kind < 17.5) {
        base *= 1.01 - 0.18 * seam;
        emission += vec3(0.31,0.38,0.38)*exp(-abs(z-1.14)*35.0);
    } else {
        float door = caRect(vec2(p.z-caWidth*0.5,p.y+0.095),vec2(0.34,0.78),0.040);
        base *= 0.84 - 0.50 * caEdge(door,0.009);
    }
    float bay=exp(-abs(rowX)*5.0)*exp(-abs(p.y-.27)*2.6)*exp(-max(0.0,z)*2.2);
    vec3 bounce=base*vec3(.18,.21,.24)*bay*daylight;
    return caLit(base,p,n,rd,daylight,0.043)+emission+bounce;
}
// Rays cross successive cross-sections of the recessed reveal, inner lip and gasket.
vec4 caWindow(vec3 ro, vec3 rd, float wallT, float daylight) {
    bool far = rd.z > 0.0;
    vec3 o = ro, d = rd;
    if (far) { o.z = caWidth-o.z; d.z = -d.z; }
    vec3 entry = o + wallT*d;
    float centerX = entry.x-caRepeat(entry.x,caPitch);
    vec2 center = vec2(centerX,0.025);
    vec2 p0 = entry.xy-center;
    vec2 b0 = vec2(0.224,0.283);
    if (caWindowShape(p0,b0)>=0.0) {
        float edge=caWindowShape(p0,b0);
        float relief=exp(-max(0.0,edge)*3.3);
        float seam=caEdge(abs(p0.x)-0.5*caPitch,0.003);
        float soft=0.17+0.83*smoothstep(-0.31,0.27,p0.y+0.45*p0.x);
        vec3 liner=vec3(0.208,0.208,0.193)*(0.18+daylight*(.12+.15*soft));
        liner+=vec3(.048,.043,.034)*relief*daylight;
        liner*=1.0-0.23*exp(-abs(edge)*31.0)-0.25*seam;
        liner*=1.0+0.071*caGrain(entry.xy)+0.020*textureLod(uNoise,entry.xy*.29,0.).r;
        caHitRange=wallT;
        return vec4(liner,1.0);
    }
    const float zs[8] = float[8](-0.110,-0.116,-0.126,-0.147,-0.191,-0.218,-0.2245,-0.226);
    const vec2 radii[8] = vec2[8](vec2(0.221,0.280),vec2(0.220,0.279),vec2(0.219,0.278),
        vec2(0.208,0.267),vec2(0.190,0.249),vec2(0.183,0.242),vec2(0.177,0.236),vec2(0.176,0.235));
    float z0 = -0.107;
    float t0 = wallT;
    float f0 = caWindowShape(p0,b0);
    for (int i=0;i<8;i++) {
        float t1=(zs[i]-o.z)/d.z;
        vec2 p1=o.xy+t1*d.xy-center;
        vec2 b1=radii[i];
        float f1=caWindowShape(p1,b1);
        if(f1>=0.0) {
            float h=clamp(-f0/max(f1-f0,0.00001),0.0,1.0);
            float travel=mix(t0,t1,h);
            vec3 point=ro+travel*rd;
            vec2 edge=mix(p0,p1,h)/mix(b0,b1,h);
            vec2 grad=normalize(sign(edge)*edge*edge/mix(b0,b1,h));
            float slope=dot(abs(grad),(b0-b1)/(z0-zs[i]));
            vec3 n=normalize(vec3(-grad,far?-slope:slope));
            float depth=mix(z0,zs[i],h);
            float grazed=dot(-grad,normalize(vec2(0.41,0.18)))*0.5+0.5;
            float s=clamp((-depth-0.107)/0.119,0.0,1.0);
            float fromGlass=pow(s,1.18);
            vec3 softbox=mix(vec3(0.79,0.88,0.99),vec3(1.08,0.98,0.82),grazed);
            float rolled=1.0-0.19*exp(-abs(s-.097)*43.0)+0.11*exp(-abs(s-.160)*22.0);
            float bounce=.10+daylight*(.055+.25*fromGlass+.53*fromGlass*grazed);
            vec3 col=vec3(.442,.420,.385)*softbox*bounce*rolled;
            col+=vec3(.079,.092,.097)*exp(-abs(s-.882)*26.0)*daylight;
            col*=1.0-.27*exp(-abs(s-.942)*70.0);
            float rubber=smoothstep(.958,.981,s);
            col=mix(col,vec3(.025,.029,.031)*(.4+.48*grazed+.21*h),rubber);
            col*=1.0+.046*caGrain(point.xy);
            float glint=pow(1.0-abs(dot(n,rd)),3.0);
            col+=vec3(.029,.034,.036)*glint*daylight*(1.0-.75*rubber);
            caHitRange=travel;
            return vec4(col,1.0);
        }
        p0=p1; b0=b1; t0=t1; z0=zs[i]; f0=f1;
    }
    return vec4(0.0);
}
vec4 renderCabin(vec3 ro, vec3 rd, float t, float daylight) {
    caHitRange=1000.0;
    // From a window seat even an oblique outside ray reaches the sidewall before a seat.
    if(rd.z < -0.10 && ro.z < 0.125) {
        float d=(-0.107-ro.z)/rd.z;
        vec3 p=ro+rd*d;
        if(p.y> -0.345 && p.y<0.393 && abs(p.x)<0.235) return caWindow(ro,rd,d,daylight);
    }
    vec4 wall = vec4(10000.0,-1.0,0.0,0.0);
    if(abs(rd.x)>0.0001) {
        float wallX = rd.x>0.0 ? caEnd : -caEnd;
        wall=vec4((wallX-ro.x)/rd.x,18.0,0.0,0.0);
    }
    caPanel(ro,rd,vec2(0.113,-1.030),vec2(caWidth-0.113,-1.030),10.0,wall);
    caHalfShell(ro,rd,0.0,wall);
    caHalfShell(ro,rd,1.0,wall);
    // Restrict the repeated interior geometry to the occupied vertical slab.
    float lo=0.002, hi=wall.x;
    if(abs(rd.y)>0.0001) {
        float a=(-1.027-ro.y)/rd.y, b=(0.163-ro.y)/rd.y;
        lo=max(lo,min(a,b)); hi=min(hi,max(a,b));
    }
    if(lo < hi) {
        float travel=lo;
        for(int step=0;step<82;step++) {
            vec3 p=ro+rd*travel;
            vec2 sampleSeat=caSeatMap(p);
            float eps=0.00048+0.00062*travel;
            if(sampleSeat.x<eps) {
                caHitRange=travel;
                vec3 n=caSeatNormal(p,eps*0.51);
                return vec4(caShadeSeat(p,n,rd,sampleSeat.y,daylight),1.0);
            }
            travel+=max(eps,sampleSeat.x*0.88);
            if(travel>=hi) break;
        }
    }
    if(wall.y==12.0) return caWindow(ro,rd,wall.x,daylight);
    vec3 n = wall.y==18.0 ? vec3(-sign(rd.x),0,0) : vec3(0,wall.z,wall.w);
    caHitRange=wall.x;
    return vec4(caShadePanel(ro+rd*wall.x,n,rd,wall.y,daylight),1.0);
}
vec3 cabinGlass(vec3 exterior, vec3 ro, vec3 rd, float t, float daylight) {
    // Two offset reflections mimic the isolated panes. Projected opposite-side windows
    // and ceiling coves stay fixed in cabin space as the ocean moves behind them.
    float facing = max(0.08,abs(rd.z));
    float paneZ = rd.z<0.0 ? -0.226 : caWidth+0.226;
    vec3 pane = ro + rd*((paneZ-ro.z)/rd.z);
    vec2 paneUV=vec2(caRepeat(pane.x,caPitch),pane.y-0.025);
    vec2 unitPane=paneUV/vec2(.176,.235);
    float curvature=dot(unitPane,unitPane);
    vec2 slope=rd.xy/facing+unitPane*(.011+.014*curvature);
    vec2 farUV=pane.xy+slope*(caWidth+0.32);
    vec2 uv=vec2(caRepeat(farUV.x,caPitch),farUV.y-0.025);
    float glow=1.0-smoothstep(0.74,1.44,caWindowShape(uv,vec2(0.171,0.235))+1.0);
    float ghost=1.0-smoothstep(0.73,1.51,caWindowShape(uv+vec2(0.018,0.009),vec2(0.172,0.235))+1.0);
    vec2 head=pane.xy+slope*1.34;
    float headDist=caRect(vec2(caRepeat(head.x+.367,caPitch),head.y+.153),vec2(.066,.292),.054);
    float seatScreen=.16+.84*smoothstep(-.028,.028,headDist);
    vec2 trim=pane.xy+slope*2.78;
    float coveBreak=.52+.48*smoothstep(.025,.21,abs(caRepeat(trim.x,1.5*caPitch)));
    float cove=exp(-abs(trim.y-.693)*60.0)*coveBreak;
    float lower=exp(-abs(trim.y-.666)*70.0)*coveBreak;
    float fresnel=0.018+0.17*pow(1.0-facing,4.0);
    float rim=exp(14.0*min(0.0,caWindowShape(paneUV,vec2(.176,.235))));
    vec3 reflected=vec3(0.032,0.039,0.044)+vec3(.31,.36,.41)*(.72*glow+.28*ghost)*daylight*seatScreen;
    reflected+=vec3(.66,.49,.31)*(.81*cove+.23*lower)*seatScreen;
    reflected+=vec3(.31,.36,.37)*rim*(.26+1.38*(1.0-facing))*daylight;
    return exterior*vec3(0.994,0.997,1.0)*(1.0-fresnel*0.38)+reflected*fresnel;
}

</script>
<script id="wing" type="x-shader/x-fragment">
// Port wing, in aircraft coordinates (metres).
float wiHitRange = 32.0;
float wiLead(float s) {
    float tip = max(0.0, s - 15.65);
    return -1.80 - 0.21 * (s - 0.75) - 0.21 * tip * tip;
}
float wiChord(float s) {
    return 7.26 - 0.42 * (s - 0.75) + 0.104 * max(0.0, s - 5.25)
                - 0.31 * max(0.0, s - 15.65);
}
float wiHeight(float s, float flex) {
    float bend = max(0.0, s - 15.6);
    float upturn = max(0.0, s - 17.0);
    return -1.9 + 0.052 * s + (0.0012 + flex) * s * s
                + 0.32 * bend * bend + 0.45 * upturn * upturn;
}
float wiAirfoil(float s, float x, float flex) {
    float chord = wiChord(s);
    float f = clamp((wiLead(s) - x) / chord, 0.0, 1.0);
    return wiHeight(s, flex) + 0.092 * chord * sqrt(f) * (1.0 - f);
}
float wiSeam(float distanceToLine, float halfWidth, float footprint) {
    float aa = max(0.001, footprint * 0.65);
    return (1.0 - smoothstep(max(0.0, halfWidth - aa), halfWidth + aa, distanceToLine))
           * min(1.0, halfWidth / aa);
}
float wiGrid(float x, float interval) {
    return abs(fract(x / interval + 0.5) - 0.5) * interval;
}
vec3 wiPaint(vec3 p, vec3 rd, float s, float f, float t, float daylight, float flex) {
    float chord = wiChord(s);
    float px = max(0.001, length(p) * 1.2 / max(uResolution.y, 200.0));
    float paintVariation = fract(sin(floor((s + .26) / 1.52) * 31.17
                                    + floor(f * 3.7) * 19.93) * 4375.49);
    float slat = 1.0 - smoothstep(0.134, 0.138, f);
    float nose = 1.0 - smoothstep(0.048, 0.083, f);
    float spoilerFront = 0.515 + 0.029 * fract((s + .26) / 1.52);
    float spoilerRear = 0.691;
    float spoilers = smoothstep(4.0, 4.04, s) * (1.0 - smoothstep(13.9, 13.94, s));
    float bayCross = wiGrid(s + .26, 1.52);
    float maskSpoiler = step(spoilerFront, f) * step(f, spoilerRear) * spoilers;
    float flapFront = 0.754 + 0.025 * smoothstep(5.7, 6.5, s);
    float flap = smoothstep(flapFront - .002, flapFront + .002, f);
    float panel = wiSeam(abs(f - 0.137) * chord, 0.008, px);
    panel = max(panel, wiSeam(abs(f - flapFront) * chord, 0.009, px));
    panel = max(panel, wiSeam(min(abs(f - spoilerFront), abs(f - spoilerRear)) * chord,
                              0.008, px) * spoilers);
    panel = max(panel, wiSeam(bayCross, 0.009, px) * max(0.26, max(slat, maskSpoiler)));
    panel = max(panel, wiSeam(wiGrid(s - 4.6, 3.74), 0.014, px) * flap);
    float fasteners = wiSeam(abs(bayCross - 0.045), 0.007, px)
                      * wiSeam(wiGrid(f * chord, 0.081), 0.006, px)
                      * (1.0 - smoothstep(.012, .034, px));
    float accessJoint = wiSeam(abs(f - 0.372) * chord, 0.004, px) * 0.28;
    float camberSlope = 0.092 * (0.5 * (1.0 - f) / sqrt(max(0.002, f)) - sqrt(f));
    float spanSlope = .052 + 2.0 * (.0012 + flex) * s
                      + .64 * max(0.0, s - 15.6) + .90 * max(0.0, s - 17.0);
    vec3 n = normalize(vec3(camberSlope, 1.0, spanSlope - 0.21 * camberSlope));
    vec3 sun = normalize(vec3(0.40, 0.16, -0.90));
    vec3 r = reflect(rd, n);
    float nL = max(0.0, dot(n, sun));
    float nV = clamp(dot(n, -rd), .001, 1.0);
    vec3 base = mix(vec3(.64, .685, .705), vec3(.46, .51, .55), nose);
    base *= 1.0 + .027 * (paintVariation - 0.5) - .045 * maskSpoiler - .025 * flap;
    float tipColour = smoothstep(16.65, 16.70, s - .22 * f);
    base = mix(base, vec3(.063, .119, .157) * (1.0 + .14 * (1.0 - f)), tipColour);
    // The polished cap wraps around the leading edge of the winglet.
    base = mix(base, vec3(.52, .57, .58), tipColour * (1.0 - smoothstep(.023, .065, f)));
    float marker = smoothstep(16.02,16.11,s) * (1.0-smoothstep(16.24,16.34,s))
                   * (1.0 - smoothstep(.037, .075, f));
    base = mix(base, vec3(.16,.021,.018), marker);
    float panelsVisible = 1.0 - smoothstep(15.6, 16.6, s);
    base *= 1.0 - (0.47 * panel + 0.22 * fasteners + accessJoint) * panelsVisible;
    float fresnel = 0.042 + 0.66 * pow(1.0 - nV, 5.0);
    float skyward = clamp(r.y * 1.6, 0.0, 1.0);
    vec3 environment = mix(vec3(.62,.69,.74), vec3(.205,.394,.56), skyward);
    environment += vec3(.48,.28,.11) * pow(max(dot(r,sun),0.0), 9.0);
    float rootOcclusion = mix(.71, 1.0, smoothstep(1.0, 5.4, s));
    vec3 illumination = mix(vec3(.23,.29,.35), vec3(.56,.625,.68), daylight)
                       + vec3(1.05,.78,.49) * nL * daylight;
    float polish = mix(.14, .62, nose);
    vec3 color = base * illumination * rootOcclusion;
    color = mix(color, environment * (.26 + .74 * daylight), fresnel + .09 * polish);
    color += vec3(1.4,1.06,.72) * daylight * polish * pow(max(dot(r,sun),0.0), 100.0);
    return color;
}
vec4 renderWing(vec3 ro, vec3 rd, float t, float daylight) {
    if (rd.z > -.035) return vec4(0.0);
    vec2 slope = rd.xy / -rd.z;
    if (slope.x > .45 || slope.x < -11.0 || slope.y > .135 || slope.y < -3.0) return vec4(0.0);
    float flex = .00016 * sin(t*.91) + .00010 * sin(t*1.67 + .8);
    const float stations[7] = float[7](.72, 6.0, 12.0, 15.55, 16.75, 17.45, 17.94);
    float s0 = stations[0];
    vec2 ray0 = ro.xy + (s0 + ro.z) * slope;
    float h0 = wiAirfoil(s0, ray0.x, flex) - ray0.y;
    for (int i=1; i<7; ++i) {
        float s1 = stations[i];
        vec2 ray1 = ro.xy + (s1 + ro.z) * slope;
        float h1 = wiAirfoil(s1, ray1.x, flex) - ray1.y;
        if (h0 * h1 <= 0.0) {
            float a = s0, b = s1, ha = h0, hb = h1;
            float s = s0;
            for (int j=0; j<3; ++j) {
                float ratio = abs(ha) / max(.000001, abs(ha) + abs(hb));
                s = mix(a, b, ratio);
                vec2 xy = ro.xy + (s + ro.z) * slope;
                float d = wiAirfoil(s, xy.x, flex) - xy.y;
                if (ha * d <= 0.0) { b = s; hb = d; }
                else { a = s; ha = d; }
            }
            vec2 xy = ro.xy + (s + ro.z) * slope;
            float f = (wiLead(s) - xy.x) / wiChord(s);
            if (f >= 0.0 && f <= 1.0) {
                wiHitRange = (s + ro.z) / -rd.z;
                return vec4(wiPaint(vec3(xy,-s), rd, s, f, t, daylight, flex), 1.0);
            }
        }
        s0 = s1;
        h0 = h1;
    }
    // Streamlined flap-track fairings protrude behind the trailing edge.
    if (slope.x < -.47 && slope.y < -.045) {
        for (int i=0; i<3; ++i) {
            float s = 4.6 + 3.74 * float(i);
            float scale = 1.0 - .14 * float(i);
            vec3 center = vec3(wiLead(s)-wiChord(s)+.26*scale, wiHeight(s,flex)-.15*scale, -s);
            vec3 axes = vec3(1.13,.20,.155) * scale;
            vec3 oc = (ro - center) / axes;
            vec3 d = rd / axes;
            float b = dot(oc,d);
            float aa = dot(d,d);
            float det = b*b - aa*(dot(oc,oc)-1.0);
            if (det > 0.0) {
                float hit = (-b - sqrt(det)) / aa;
                if (hit <= 0.0) continue;
                wiHitRange = hit;
                vec3 n = normalize((oc + hit*d) / axes);
                float key = max(0.0, dot(n,normalize(vec3(.4,.16,-.9))));
                vec3 color = vec3(.39,.45,.49) * (.23 + .34*daylight + .25*n.y)
                             + vec3(.39,.29,.18) * key * daylight;
                return vec4(color,1.0);
            }
        }
    }
    return vec4(0.0);
}

<script id="composite" type="x-shader/x-fragment">

uniform sampler2D uOutside;
uniform mat3 uPriorView;
uniform vec2 uPriorLens;
uniform vec3 uDisplacement;
uniform float uShutter;
uniform sampler2D uMeter;
uniform float uDaylight;
uniform float uCloud;
vec3 unpackRadiance(vec3 x){
    x*=x;
    return x/max(vec3(0.003),1.0-x);
}
vec3 shutterSample(vec2 uv,vec3 ray){
    vec4 s=texture(uOutside,uv);
    float depth=max(0.025,exp2(s.a*log2(401.0))-1.0);
    vec3 oldRay=uPriorView*(ray*depth+uDisplacement);
    vec2 oldUV=0.5+0.5*oldRay.xy/(uPriorLens*max(.001,-oldRay.z));
    vec2 drag=(oldUV-uv)*uShutter;
    // Limit the shutter during fast pointer movements. At cruise only near wisps smear.
    drag/=max(1.0,length(drag*uResolution)/7.0);
    if(dot(drag*uResolution,drag*uResolution)<.18)return unpackRadiance(s.rgb);
    vec3 sum=vec3(0.0); float weights=0.0;
    for(int i=0;i<5;i++){
        vec4 tap=texture(uOutside,uv+drag*(float(i)*.25));
        float w=1.0-smoothstep(.018,.11,abs(tap.a-s.a));
        sum+=w*unpackRadiance(tap.rgb); weights+=w;
    }
    return sum/max(weights,1.0);
}
vec3 displayRGB(vec3 linear){
    vec2 ev=texelFetch(uMeter,ivec2(0),0).rg;
    float exposure=(ev.r+ev.g/255.)*2.;
    vec3 x=max(linear*vec3(1.02,1.0,.975)*exposure,0.0);
    // Luminance-preserving shoulder keeps bright cloud edges and the sun path distinct.
    vec3 mapped=(x*(2.51*x+.03))/(x*(2.43*x+.59)+.14);
    return pow(clamp(mapped,0.0,1.0),vec3(1.0/2.2));
}
void main(){
    vec2 uv=gl_FragCoord.xy/uResolution;
    vec3 local=localRay(uv);
    vec4 cabin=renderCabin(uEye,local,uTime,uDaylight);
    vec3 col=cabin.rgb;
    float range=cabin.a>.5?caHitRange:95.;
    if(cabin.a<.5){
        vec3 rd=uAirframe*local;
        vec4 wing=renderWing(uEye,local,uTime,uDaylight);
        if(wing.a>.001){
            range=wiHitRange;
            col=mix(wing.rgb,vec3(.64,.70,.74),1.-exp(-uCloud*wiHitRange*.032));
            if(wing.a<.999)col=mix(shutterSample(uv,rd),col,wing.a);
        }else col=shutterSample(uv,rd);

    vec3 c=displayRGB(col);

<script id="meter" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform sampler2D uOutside;
uniform sampler2D uHistory;
uniform float uDelta,uCloud;
out vec4 pixel;
void main(){
    // Center-weighted reflected-light meter. Invalid sky texels are the shaded cabin wall.
    float total=0.0,weight=0.0;
    for(int j=0;j<5;j++)for(int i=0;i<7;i++){
        vec2 uv=(vec2(i,j)+.5)/vec2(7.,5.);
        vec4 s=texture(uOutside,uv);
        vec3 x=s.rgb*s.rgb; x/=max(vec3(.002),1.0-x);
        float lum=s.a>0.0?dot(x,vec3(.2126,.7152,.0722)):mix(.13,.07,uCloud);
        float w=exp(-dot(uv-.5,uv-.5)*6.0);
        total+=w*log(max(.03,lum));weight+=w;
    }
    float target=clamp(.99*pow(.39/exp(total/weight),.51),.73,1.76);
    vec2 old=texelFetch(uHistory,ivec2(0),0).rg;
    float last=(old.r+old.g/255.)*2.0;
    float change=1.0-exp(-min(.24,uDelta)*(target<last?2.6:.83));
    float value=mix(last,target,change)*.5;
    float hi=floor(value*255.);
    pixel=vec4(hi/255.,value*255.-hi,0,1);

</script>
<script id="post" type="x-shader/x-fragment">
#version 300 es
precision highp float;
uniform sampler2D uFrame;
uniform vec2 uResolution,uLens,uPriorLens;
uniform mat3 uCamera,uPriorView;
uniform vec3 uDisplacement;
uniform float uShutter;

float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
    vec2 texel=1.0/uResolution,uv=gl_FragCoord.xy*texel;

    if(center.a<.95){

        float range=max(.06,exp2(center.a/.90*5.)-1.);
        if(range<.50){
            float blur=(1.-smoothstep(.13,.50,range))*min(2.,.0018*uResolution.y);
            vec2 b=blur*texel;
            vec3 soft=texture(uFrame,uv+vec2(b.x,b.y*.37)).rgb+texture(uFrame,uv+vec2(-b.x,-b.y*.37)).rgb

            c=mix(c,soft*.25,.68);
        }
        vec3 ray=normalize(uCamera*vec3((uv*2.-1.)*uLens,-1));
        vec3 oldRay=uPriorView*(ray*range+uDisplacement);
        vec2 oldUV=.5+.5*oldRay.xy/(uPriorLens*max(.001,-oldRay.z));
        vec2 drag=(oldUV-uv)*uShutter;
        drag/=max(1.,length(drag*uResolution)/6.);

            for(int i=1;i<5;i++)c+=texture(uFrame,uv+drag*(float(i)*.24)).rgb;
            c*=.2;
        }
    }
    // Edge-directed antialiasing for the dark window seal and the thin wingtip.
    float nw=luma(texture(uFrame,uv+texel*vec2(-.75,.75)).rgb);
    float ne=luma(texture(uFrame,uv+texel*vec2(.75,.75)).rgb);
    float sw=luma(texture(uFrame,uv+texel*vec2(-.75,-.75)).rgb);
    float se=luma(texture(uFrame,uv+texel*vec2(.75,-.75)).rgb);
    float low=min(min(nw,ne),min(sw,se)),high=max(max(nw,ne),max(sw,se));
    if(high-low>max(.045,.14*high)){
        vec2 edge=vec2(-(nw+ne-sw-se),nw+sw-ne-se);
        edge=clamp(edge/(min(abs(edge.x),abs(edge.y))+max(.014,(nw+ne+sw+se)*.032)),-3.,3.)*texel;
        c=mix(c,.5*(texture(uFrame,uv+edge*.31).rgb+texture(uFrame,uv-edge*.31).rgb),.67);
    }
    pixel=vec4(c,1);
}
</script>
<script>

'use strict';
const canvas=document.getElementById('scene');
const message=document.getElementById('message');
const flightRoot=document.getElementById('flight');
const pauseButton=document.getElementById('pause');
const homeButton=document.getElementById('home');
const screenButton=document.getElementById('screen');
const rad=degrees=>degrees*Math.PI/180;

const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const defaultPitch=rad(-9);

const flight={time:0,paused:reducedMotion,lastFrame:0,quality:.88};

const pointers=new Map();
const now=()=>performance.now()*.001;
function inputReceived(){

function interruptReturn(){
    if(!view.returning)return;

function returnToWindow(){

function syncPauseButton(){
    const label=flight.paused?'Resume flight':'Pause flight';
    pauseButton.setAttribute('aria-label',label);
    pauseButton.title=label+' (Space)';
    document.getElementById('pause-icon').toggleAttribute('hidden',flight.paused);
    document.getElementById('play-icon').toggleAttribute('hidden',!flight.paused);

function togglePause(){flight.paused=!flight.paused;syncPauseButton()}
homeButton.addEventListener('click',returnToWindow);
pauseButton.addEventListener('click',togglePause);
screenButton.hidden=!document.fullscreenEnabled;
screenButton.addEventListener('click',async()=>{

        if(document.fullscreenElement)await document.exitFullscreen();

});
document.addEventListener('fullscreenchange',()=>{
    const label=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen';

function adjustZoom(multiplier){

canvas.addEventListener('pointerdown',e=>{

});
canvas.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;

    const curr=gesture();
    const scale=2.9/(Math.max(300,canvas.clientHeight)*view.zoom);

    view.targetPitch=limit(view.targetPitch+(curr.y-prev.y)*scale,-1.53,1.53);
    if(curr.span>4&&prev.span>4)adjustZoom(curr.span/prev.span);
    inputReceived();
});
function release(e){if(pointers.delete(e.pointerId))inputReceived()}
for(const eventName of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(eventName,release);
canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    interruptReturn();
    const pixels=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1);
    adjustZoom(Math.exp(-limit(pixels,-1200,1200)*.00145));
    inputReceived();

window.addEventListener('blur',()=>{pointers.clear();view.lastInput=now()});
window.addEventListener('keydown',e=>{
    if(e.altKey||e.metaKey||e.ctrlKey)return;
    if(e.target.closest?.('button')&&(e.key==='Enter'||e.key===' '))return;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','_'].includes(e.key))interruptReturn();
    const stride=.125/view.zoom;
    switch(e.key){
        case 'ArrowLeft':view.targetYaw-=stride;break;
        case 'ArrowRight':view.targetYaw+=stride;break;
        case 'ArrowUp':view.targetPitch=limit(view.targetPitch+stride,-1.53,1.53);break;
        case 'ArrowDown':view.targetPitch=limit(view.targetPitch-stride,-1.53,1.53);break;
        case '+':case '=':adjustZoom(1.13);break;
        case '-':case '_':adjustZoom(1/1.13);break;
        case 'Home':returnToWindow();e.preventDefault();return;
        case ' ':if(!e.repeat)togglePause();e.preventDefault();return;
        case 'h':case 'H':if(!e.repeat)flightRoot.classList.toggle('clean');return;
        default:return;
    }
    inputReceived();e.preventDefault();
});
syncPauseButton();

// Matrices are column-major. The camera looks along local -Z; the airplane flies along +X.
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return [1,0,0,0,c,s,0,-s,c]}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return [c,0,-s,0,1,0,s,0,c]}
function rotZ(a){const c=Math.cos(a),s=Math.sin(a);return [c,s,0,-s,c,0,0,0,1]}
function product(a,b){
    const out=[];

}

function rig(t,aspect){
    const tremor=Math.sin(t*.91+1.3)*.55+Math.sin(t*1.63)*.30+Math.sin(t*2.79+.6)*.15;
    const drift=Math.sin(t*.28)*.63+Math.sin(t*.69)*.37;

const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'});
const vertexSource=`#version 300 es
void main(){
    vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
    gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`;
function program(fragment){

    });

    shaders.forEach(s=>gl.attachShader(id,s));

function finishProgram(p){
    if(!gl.getProgramParameter(p.id,gl.LINK_STATUS)){

    }
    p.shaders.forEach(s=>gl.deleteShader(s));
    p.u={};
    for(let i=0;i<gl.getProgramParameter(p.id,gl.ACTIVE_UNIFORMS);i++){
        const name=gl.getActiveUniform(p.id,i).name;

function makeNoise(){
    // Seeded, independent RG channels. Shaders interpolate lattice values into coherent 3D noise.
    let state=138739413;

    }

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);

}
let engine=null;
function texture2D(unit,texture){
    gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,texture);
}
function newTarget(w=1,h=1,bytes=null){
    const tex=gl.createTexture();texture2D(1,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
    for(const prop of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,prop,gl.LINEAR);
    for(const prop of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,prop,gl.CLAMP_TO_EDGE);

}
function outputTo(texture,width,height){

}
function resizeTargets(){
    const e=engine,wCSS=Math.max(1,canvas.clientWidth),hCSS=Math.max(1,canvas.clientHeight);
    const dpr=Math.min(window.devicePixelRatio||1,1.7),q=flight.quality;
    const px=Math.min(dpr,Math.sqrt(lerp(420000,2300000,q)/(wCSS*hCSS)));
    const w=Math.max(1,Math.round(wCSS*px)),h=Math.max(1,Math.round(hCSS*px));
    const scale=lerp(.44,.94,q);
    const ew=Math.max(1,Math.round(w*scale)),eh=Math.max(1,Math.round(h*scale));
    if(w===canvas.width&&h===canvas.height&&ew===e.ew&&eh===e.eh)return;
    canvas.width=w;canvas.height=h;e.ew=ew;e.eh=eh;e.previous=null;
    for(const tex of [...e.exteriors,e.frame]){
        const full=tex===e.frame;
        texture2D(1,tex);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,full?w:ew,full?h:eh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);

function cloudAtEye(world,t){
    const [wx,wy,wz]=world;
    const x=((wx-11.8+21.5)%43+43)%43-21.5;
    const curl=.10*Math.sin(wz*1.5+wy*2.1+x*1.9)+.06*Math.sin(x*4.7-wy+t*.027);
    const a=limit((Math.hypot(x/2.9,(wy-10.05)/1.8,(wz+.55)/5.5)+curl-.55)/.59,0,1);

function setCommon(p,rig,width,height){

    resizeTargets();

let raf=0;
function animate(ms){
    raf=0;
    if(!engine||document.hidden||gl.isContextLost())return;
    const elapsed=flight.lastFrame?(ms-flight.lastFrame)*.001:1/60;
    const dt=limit(elapsed,0,.24);
    flight.lastFrame=ms;
    if(!flight.paused)flight.time+=dt;
    if(!pointers.size&&!view.returning&&now()-view.lastInput>4.5)returnToWindow();
    const blend=1-Math.exp(-dt*(view.returning?2.35:23));
    view.yaw=lerp(view.yaw,view.targetYaw,blend);
    view.pitch=lerp(view.pitch,view.targetPitch,blend);
    view.zoom=lerp(view.zoom,view.targetZoom,blend);
    const e=engine;
    const settled=Math.abs(view.yaw-view.targetYaw)+Math.abs(view.pitch-view.targetPitch)+Math.abs(view.zoom-view.targetZoom)<.00005;
    const sizeChanged=e.cssW!==canvas.clientWidth||e.cssH!==canvas.clientHeight||e.dpr!==window.devicePixelRatio;
    e.stillFor=flight.paused&&settled&&!sizeChanged?e.stillFor+dt:0;
    if(e.stillFor<3.5){
        drawScene(dt);
        e.cssW=canvas.clientWidth;e.cssH=canvas.clientHeight;e.dpr=window.devicePixelRatio;
    }
    if(!flight.paused&&++e.frames>20){
        e.average=lerp(e.average,Math.min(.2,elapsed),.045);
        if(performance.now()>e.adjustAfter){
            if(e.average>.043&&flight.quality>.05)flight.quality=Math.max(.05,flight.quality-.18);
            else if(e.average<.021&&flight.quality<1)flight.quality=Math.min(1,flight.quality+.08);
            e.adjustAfter=performance.now()+2400;
        }
    }
    raf=requestAnimationFrame(animate);
}
function wake(){if(!raf&&engine&&!document.hidden){flight.lastFrame=0;raf=requestAnimationFrame(animate)}}
document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake();
});
canvas.addEventListener('webglcontextlost',e=>{
    e.preventDefault();cancelAnimationFrame(raf);raf=0;engine=null;
    message.textContent='Restoring the window view…';message.hidden=false;
});
canvas.addEventListener('webglcontextrestored',()=>initialize().catch(showError));
function showError(err){
    console.error(err);message.hidden=false;
    message.textContent='The window view needs WebGL 2. Enable graphics acceleration in your browser, then reload.';
}
async function initialize(){
    if(!gl)throw Error('WebGL 2 unavailable');
    const source=id=>document.getElementById(id).textContent.trim();
    const header=source('shader-head');
    const world=program(header+'\n'+source('exterior')+'\n'+source('world-main'));
    const final=program(header+'\n'+source('cabin')+'\n'+source('wing')+'\n'+source('composite'));
    const meter=program(source('meter')),post=program(source('post'));

    if(parallel)while(!programs.every(p=>gl.getProgramParameter(p.id,parallel.COMPLETION_STATUS_KHR))){
